[project]
name = "mail-bot"
version = "0.1.0"
description = "Personal Telegram email + calendar assistant built on Google ADK + Gemini."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "caldav>=1.3",
    "chromadb>=1.5.9",
    "dotenv>=0.9.9",
    "google-adk[extensions]>=1.28.1",
    "imap-tools>=1.11.1",
    "python-telegram-bot[job-queue]>=22.7",
]
[tool.uv]
override-dependencies = [
  "onnxruntime==1.25.1"
]
